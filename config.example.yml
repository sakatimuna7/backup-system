version: 2

repositories:
  - name: local
    url: "local:/var/backups/restic"
    password_file: "/etc/backup-system/password"
    required: true
  - name: remote
    url: "rclone:gdrive:backup-system/vps-01"
    password_file: "/etc/backup-system/password"
    rclone_config: "/etc/backup-system/rclone.conf"
    required: false

backup:
  paths:
    - "/etc"
    - "/home"
  exclude:
    - "/proc"
    - "/sys"
    - "/dev"
    - "/run"
    - "/tmp"
    - "/var/cache"
    - "/var/tmp"
    - "/mnt"
    - "/media"

retention:
  daily: 14
  weekly: 8
  monthly: 6
  prune: false

verify:
  after_backup: true

schedule:
  enabled: true
  on_calendar: "*-*-* 02:00:00"
  persistent: true
  randomized_delay: "15m"
